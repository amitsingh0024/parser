services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: baidu-unlimited-ocr2:latest
    container_name: baidu_ocr_service
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount cache and outputs so weights don't need re-downloading or re-training
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
